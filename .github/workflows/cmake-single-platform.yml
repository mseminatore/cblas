# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, windows-latest]
        
    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # NB: add -V to see full test output
      run: ctest --rerun-failed --output-on-failure --timeout 180 -C ${{env.BUILD_TYPE}}

  # AddressSanitizer + UndefinedBehaviorSanitizer on x64. ASan checks every memory
  # access, so it flags an out-of-bounds deterministically even when the
  # uninstrumented crash is intermittent (timing/ASLR/runner-hardware dependent).
  # This is the diagnostic for the intermittent x64 blas_test crash in MT GEMM.
  asan:
    name: ASan/UBSan (ubuntu x64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configure CMake (ASan + UBSan)
      run: >
        cmake -B ${{github.workspace}}/build-asan
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - name: Build
      run: cmake --build ${{github.workspace}}/build-asan
    - name: Test (ASan/UBSan)
      working-directory: ${{github.workspace}}/build-asan
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --output-on-failure --timeout 600

  # ThreadSanitizer on x64 - flags a residual data race in the worker pool / MT
  # GEMM dispatch (the other possible cause of the intermittent crash).
  tsan:
    name: TSan (ubuntu x64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configure CMake (TSan)
      run: >
        cmake -B ${{github.workspace}}/build-tsan
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
    - name: Build
      run: cmake --build ${{github.workspace}}/build-tsan
    - name: Test (TSan)
      working-directory: ${{github.workspace}}/build-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1
      run: ctest --output-on-failure --timeout 600

